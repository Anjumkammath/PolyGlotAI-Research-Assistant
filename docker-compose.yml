services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./storage/qdrant:/qdrant/storage

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      - qdrant

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_BASE_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "8501:8501"

  react-frontend:
    build:
      context: .
      dockerfile: frontend-react/Dockerfile
      args:
        VITE_API_BASE_URL: http://127.0.0.1:8000
    depends_on:
      - backend
    ports:
      - "5173:80"
